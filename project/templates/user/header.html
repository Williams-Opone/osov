<style>
    /* Underline Effect Styles */
    .nav-link::after {
        content: '';
        position: absolute;
        width: 0;
        height: 2px;
        bottom: 0;
        left: 0;
        background-color: #dc2626; /* red-600 */
        transition: width 0.3s ease;
    }

    .nav-link:hover::after, 
    .nav-link.active::after {
        width: 100%;
    }

    .nav-link.active {
        color: #dc2626; /* red-600 */
    }

    /* Mobile active state style */
    .nav-link-mobile.active {
        color: #dc2626;
        padding-left: 8px;
        border-left: 4px solid #dc2626;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const menuIcon = document.getElementById('menuIcon');
        const mobileMenu = document.getElementById('mobileMenu');
        
        // --- 1. Active Link Logic ---
        const currentPath = window.location.pathname;
        const allLinks = document.querySelectorAll('.nav-link, .nav-link-mobile');
        
        allLinks.forEach(link => {
            // Check if the link's href matches the current URL path
            if (link.getAttribute('href') === currentPath) {
                link.classList.add('active');
            }
        });

        // --- 2. Mobile Menu Toggle ---
        window.toggleMobileMenu = function() {
            if (mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.remove('hidden');
                menuIcon.classList.remove('fa-bars');
                menuIcon.classList.add('fa-xmark');
                mobileMenu.style.opacity = "0";
                setTimeout(() => { mobileMenu.style.opacity = "1"; }, 10);
            } else {
                mobileMenu.classList.add('hidden');
                menuIcon.classList.remove('fa-xmark');
                menuIcon.classList.add('fa-bars');
            }
        };
    });
</script>
